<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BioID analysis report</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --ink: #17212e; --muted: #64748b;
    --line: #e2e8f0; --pass: #157a48; --warn: #b26a00; --chip: #eef2f7;
    --accent: #2b6cb0; --shadow: 0 1px 2px rgba(15, 32, 52, .05), 0 4px 14px rgba(15, 32, 52, .04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header { background: linear-gradient(135deg, #0f2437 0%, #1b3f61 62%, #23557f 100%);
           color: #fff; padding: 20px 26px 16px; }
  header h1 { margin: 0 0 5px; font-size: 21px; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: #b9cbdc; font-size: 12.5px; }
  header .badges { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.20);
           border-radius: 999px; padding: 3px 11px; font-size: 12px; color: #e7eef6; }
  .badge b { font-weight: 650; }
  /* Screen-only hints are hidden when the page is printed (see @media print). */
  .screen-only { display: inline; }
  .capbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
            justify-content: space-between; }
  .pickbar { display: flex; gap: 8px; align-items: center; }
  .headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  /* Printing is the browser's own job now: the open panel prints as it looks on
     screen, with the interactive chrome and the header hints removed. */
  @page { size: letter landscape; margin: 10mm; }
  @media print {
    header { background: #ffffff !important; color: #17212e !important; padding: 0 0 10px; }
    header h1 { font-size: 18px; }
    header .sub, header .badges { color: #4a5b6e !important; }
    .badge { background: #f1f5f9 !important; border-color: #d8e0ea !important; color: #33475b !important; }
    .tabs, .toolbar, .btn, .modebar, footer, .suggest, #label-note, .pickbar { display: none !important; }
    body { background: #ffffff; font-size: 11px; }
    main { padding: 0; width: 960px !important; margin: 0 auto; }
    /* Print what is on screen: the open panel only, so a stray Cmd+P does not
       emit a dozen empty shells. */
    .panel.active { display: block !important; position: static !important; width: auto !important; }
    .card { box-shadow: none; border-color: #dbe3ec; }

    .scroll { max-height: none !important; overflow: visible !important; }
    .screen-only { display: none !important; }
    table { font-size: 8.5px; }
    th, td { padding: 3px 5px; }
    table { page-break-inside: auto; }
    tr { page-break-inside: avoid; break-inside: avoid; }
    /* The overview table has more columns than fit a page. Rather than squeeze
       every cell (which makes the text unreadable), the two diagnostic load
       columns are dropped on paper — the workbook keeps them — and the font
       shrinks a little. */
    .scroll table.wide { font-size: 7.5px; }
    .scroll table.wide th:nth-child(6), .scroll table.wide td:nth-child(6),
    .scroll table.wide th:nth-child(8), .scroll table.wide td:nth-child(8) {
      display: none !important; }
    .keep-together, .cards, .banner, .capbar { page-break-inside: avoid; break-inside: avoid; }
    /* A heading must not be stranded at the foot of a page with its list overleaf. */
    h3, h4 { break-after: avoid; page-break-after: avoid; }
    li { break-inside: avoid; page-break-inside: avoid; }
    /* The candidate table used to run off the right edge and clip its last column
       (the CRAPome frequency). Fixed layout with explicit widths — the description
       takes the slack and wraps — keeps every column on the page. */
    #cand-table { table-layout: fixed; width: 100%; }
    #cand-table td, #cand-table th { overflow-wrap: anywhere; }
    #cand-table .screen-only { display: none !important; }
    #cand-table { font-size: 8px; }
    #cand-table th:nth-child(1) { width: 62px; }    /* Gene */
    #cand-table th:nth-child(2) { width: 78px; }    /* Accession: "Accession" must fit */
    #cand-table th:nth-child(4) { width: 74px; }    /* FC: "≥ 1750.923" needs the room */
    #cand-table th:nth-child(5) { width: 52px; }    /* log2FC */
    #cand-table th:nth-child(6) { width: 64px; }    /* raw FC */
    #cand-table th:nth-child(8), #cand-table th:nth-child(9),
    #cand-table th:nth-child(10) { width: 56px; }   /* SAINT, BFDR, q */
    #cand-table th:nth-child(11), #cand-table th:nth-child(12) { width: 46px; }
    #cand-table th:nth-child(13) { width: 56px; }   /* CRAPome % */
    #cand-table th:nth-child(14), #cand-table th:nth-child(15) { width: 52px; } /* QC score, Background */
    #cand-table th:nth-child(16) { width: 66px; }   /* Cross-sample */
    thead { break-after: avoid; }
    .capbar { page-break-after: avoid; }
    th { position: static; }
    tr:hover td, tbody tr:nth-child(even) td { background: transparent !important; }
    a { text-decoration: none; }
  }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 26px 12px; background: #1b3f61; }
  .tabs button { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
                 color: #dbe6f0; border-radius: 999px; padding: 6px 14px; font-size: 12.5px;
                 cursor: pointer; transition: background .15s, color .15s; }
  .tabs button:hover { background: rgba(255,255,255,.16); }
  .tabs button.active { background: #fff; color: #14314d; font-weight: 620; border-color: #fff; }
  main { padding: 20px 26px 60px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .cards .card { margin: 0; padding: 13px 15px; border-top: 3px solid var(--accent); }
  .kpi { font-size: 23px; font-weight: 660; letter-spacing: -.2px; }
  .kpi.small { font-size: 18px; }
  .lbl { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 14px;
             background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
             padding: 12px 16px; box-shadow: var(--shadow); }
  .toolbar label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select { font: inherit; padding: 5px 9px; border: 1px solid #cfd8e3; border-radius: 7px;
           background: #fff; color: var(--ink); cursor: pointer; }
  select:focus { outline: 2px solid #bcd3ea; outline-offset: 1px; }
  .btn { font: inherit; font-size: 12.5px; padding: 6px 12px; border: 1px solid #cfd8e3;
         border-radius: 7px; background: #f8fafc; color: #33475b; cursor: pointer; }
  .btn:hover { background: #eef4fa; }
  .markbox { flex: 1 1 380px; min-width: 300px; position: relative; }
  .markinput { position: relative; }
  .markinput input { width: 100%; font: inherit; padding: 6px 10px; border: 1px solid #cfd8e3;
                     border-radius: 7px; background: #fff; color: var(--ink); }
  .markinput input:focus { outline: 2px solid #bcd3ea; outline-offset: 1px; }
  .suggest { position: absolute; z-index: 30; top: calc(100% + 2px); left: 0; right: 0;
             background: #fff; border: 1px solid var(--line); border-radius: 8px; display: none;
             max-height: 240px; overflow: auto; box-shadow: 0 6px 18px rgba(15,32,52,.14); }
  .suggest.show { display: block; }
  .suggest div { padding: 6px 10px; font-size: 13px; cursor: pointer; display: flex;
                 justify-content: space-between; gap: 10px; }
  .suggest div:hover, .suggest div.active { background: #eef4fa; }
  .suggest span.acc { color: var(--muted); font-size: 12px; }
  .pending { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex-basis: 100%; }
  .pending:not(:empty)::before { content: "to mark:"; color: var(--muted); font-size: 12px; }
  .pend-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
               background: #eef4fa; border: 1px solid #cfd8e3; border-radius: 999px; padding: 2px 6px 2px 9px; }
  .pend-chip button, .mark-chip button { border: none; background: none; cursor: pointer;
                                         color: #8a94a6; font-size: 14px; line-height: 1; padding: 0 2px; }
  .pend-chip button:hover, .mark-chip button:hover { color: #b02a2a; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex-basis: 100%; }
  td.sel { cursor: pointer; }
  tr.picked td { background: #eaf3ec !important; }
  .mark-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
               border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
               background: #fbfcfe; color: #33475b; }
  .mark-chip .swatch { width: 16px; height: 16px; padding: 0; border-radius: 50%;
                       border: 1px solid rgba(0,0,0,.15); background: none; cursor: pointer;
                       -webkit-appearance: none; appearance: none; }
  .mark-chip .swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .mark-chip .swatch::-webkit-color-swatch { border: none; border-radius: 50%; }
  .mark-chip .swatch::-moz-color-swatch { border: none; border-radius: 50%; }
  .mark-chip .miss { color: var(--warn); }
  .mark-chip button { border: none; background: none; cursor: pointer; color: #8a94a6;
                      font-size: 14px; line-height: 1; padding: 0 2px; }
  .mark-chip button:hover { color: #b02a2a; }
  .legend-note { color: var(--muted); font-size: 12.5px; }
  .banner { display: none; border-left: 4px solid var(--warn); background: #fffaf1; padding: 11px 15px;
            border-radius: 9px; margin-bottom: 14px; font-size: 13px; border: 1px solid #f3e3c8;
            border-left-width: 4px; }
  .banner.show { display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; white-space: nowrap; }
  th { cursor: pointer; color: #4a5b6e; font-weight: 620; position: sticky; top: 0;
       background: #f8fafc; border-bottom: 1px solid var(--line); }
  th:hover { color: var(--accent); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tbody tr:nth-child(even) td { background: #fbfcfe; }
  tbody tr:hover td { background: #f2f7fc; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
  .scroll { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; }
  .notes h3 { margin: 18px 0 6px; font-size: 15px; }
  table.glossary { table-layout: fixed; }
  table.glossary th, table.glossary td { white-space: normal; vertical-align: top;
                                          text-align: left; line-height: 1.45; padding: 8px 10px; }
  table.glossary code { white-space: nowrap; }
  .notes ul { margin: 6px 0 0 18px; }
  .notes li { margin-bottom: 5px; }
  code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .hw { font-variant-numeric: tabular-nums; }
  .wrapcell { text-align: left; white-space: normal; min-width: 120px; max-width: 190px; }
  td.protein { text-align: left; white-space: normal; min-width: 160px; max-width: 300px; color: #3c4a5a; }
  table.wide th { white-space: normal; vertical-align: bottom; }
  footer { color: var(--muted); font-size: 12px; padding: 0 24px 30px; }
</style>
</head>
<body>
<header>
  <div class="headrow">
    <div>
      <h1>BioID analysis report</h1>
      <div class="sub" id="subtitle"></div>
    </div>
  </div>
  <div class="badges" id="badges"></div>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer id="footer"></footer>

<!--PLOTLY_LIB-->
<script>
const DATA = /*DATA*/null;

const STATUS_LABEL = {
  pass: "Passes all gates",
  bait_self: "The baited protein itself",
  lower_bound: "EV not detected — fold change is a lower bound",
  below_fold: "Below fold-change gate",
  crapome: "CRAPome contaminant",
  few_peptides: "Too few unique peptides",
  not_quantified: "Not quantified in experimental channel",
  qc_bg: "Batch-QC background suspect (click to hide)",
};
const PLOT_ORDER = ["not_quantified", "few_peptides", "below_fold", "crapome", "lower_bound", "pass", "bait_self"];

const fmt = (v, d = 2, suffix = "") =>
  (v === null || v === undefined || Number.isNaN(v)) ? "–" : v.toFixed(d) + suffix;
const pct = (v) => (v === null || v === undefined) ? "–" : (100 * v).toFixed(1) + "%";

// Points are shipped as arrays to keep the file small; expand them once.
function decodePoints(cond) {
  if (cond._decoded) return cond._decoded;
  const fields = DATA.pointFields;
  cond._decoded = cond.points.map((row) => {
    const obj = {};
    fields.forEach((name, i) => { obj[name] = row[i]; });
    obj.crapome = !!obj.crapome;
    obj.bait_hit = !!obj.bait_hit;
    obj.pass = !!obj.pass;
    obj.lb = !!obj.lb;
    return obj;
  });
  return cond._decoded;
}

// The gates decide who is eligible to be a candidate; this decides the order in
// which eligible candidates are drawn when more pass than the label limit.
// 'auto' is two evidence tiers, not a mixture of scales: prey the control never
// detected come first (a censored observation, ordered by its own floor), then
// everything measured, by the SAINT-style score when the mixture fitted and by
// the calibrated q value when it did not. Mixing an unscored prey into a q-ranked
// list is what made the old labels arbitrary in conditions with no signal, where
// the q values are one big tie.
const LABEL_CRITERION = {
  auto: "evidence tier: EV-undetected first, then by {second}",
  score: "SAINT-style score",
  q: "calibrated q value",
  fold: "EV-corrected fold change",
  abundance: "experimental abundance",
  combined: "batch-QC combined score",
};

function rankKey(p, mode = "auto") {
  const noScore = p.score === null || p.score === undefined;
  const noQ = p.q === null || p.q === undefined;
  switch (mode) {
    case "score": return noScore ? -1 : p.score;
    case "q": return noQ ? -1 : 1 - p.q;
    case "fold": return (p.fc === null || p.fc === undefined) ? -1 : p.fc;
    case "combined": return (p.qc_combined === null || p.qc_combined === undefined) ? -1 : p.qc_combined;
    case "abundance": return p.bait || 0;
    default:
      if (p.lb) return 2 + Math.log10(Math.max(p.fc || 1, 1));
      return noScore ? (noQ ? -1 : 1 - p.q) : p.score;
  }
}

// The x coordinate a prey is plotted at: the measured control, or the floor it was
// compared against when the control never detected it.
function xOf(p) {
  return (p.cuse !== null && p.cuse !== undefined) ? p.cuse : p.ctrl;
}

function statusOf(p, minFold, minUp) {
  if (p.bait === null || p.bait === undefined) return "not_quantified";
  // The baited protein is never a candidate (its own channel enrichment is the
  // assay working, not an interaction), so it must not be counted among them. It
  // keeps its own colour so a reader can find it — and see whether it was
  // recovered at all — without it inflating the candidate count.
  if (p.bait_hit) return "bait_self";
  if (p.crapome) return "crapome";
  if (p.up < minUp) return "few_peptides";
  // A prey the control never detected keeps its own class: its ratio is a floor,
  // not a measurement, so it must not hide among the measured candidates.
  if (p.lb && p.fc !== null && p.fc !== undefined && p.fc >= minFold) return "lower_bound";
  if (p.fc === null || p.fc === undefined || p.fc < minFold) return "below_fold";
  return "pass";
}

function countsFor(cond, minFold, minUp) {
  const counts = { pass: [], lower_bound: [], bait_self: [], below_fold: [], crapome: [],
                   few_peptides: [], not_quantified: [] };
  for (const p of decodePoints(cond)) counts[statusOf(p, minFold, minUp)].push(p);
  return counts;
}

// Candidates = the two classes that pass every gate. They are separate buckets so
// the plot can colour a censored ratio differently, but every list, count and
// label in the report means both.
function passing(counts) {
  return counts.pass.concat(counts.lower_bound);
}

// UniProt annotation for one prey: [name, gene, aliases, function] keyed by
// accession and shared across conditions, so the same protein is described the
// same way in every panel.
function annotationFor(p) {
  const table = DATA.annotations || {};
  const entry = table[p.acc] || (p.geneHint ? table[p.geneHint] : null);
  if (!entry) return null;
  return { name: entry[0] || "", gene: entry[1] || "", aliases: entry[2] || "", func: entry[3] || "" };
}

// Wrap a paragraph for the hover card: plotly only honours <br>.
function wrapText(text, width) {
  if (!text) return "";
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  for (const word of words) {
    if (line && (line.length + 1 + word.length) > width) { lines.push(line); line = word; }
    else { line = line ? line + " " + word : word; }
  }
  if (line) lines.push(line);
  return lines.join("<br>");
}

// ---------------------------------------------------------------- figure PDF
// Plotly's camera button exports a PNG; this report offers the same thing as a
// PDF, containing only the figure. Writing a PDF by hand keeps the report free of
// npm dependencies (the registry is unreachable here), and a one-image document
// is the simplest possible PDF: catalog, pages, page, image XObject, content.
function deflateBytes(bytes) {
  if (typeof CompressionStream === "function") {
    return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate")))
      .arrayBuffer().then((buf) => new Uint8Array(buf));
  }
  return Promise.resolve(null);            // caller falls back to raw samples
}

function pdfFromImage(rgb, width, height, compressed) {
  const enc = new TextEncoder();
  const pageWidth = 720;
  const pageHeight = Math.round(pageWidth * height / width);
  const chunks = [];
  const offsets = [];
  let length = 0;
  const put = (part) => {
    const bytes = typeof part === "string" ? enc.encode(part) : part;
    chunks.push(bytes);
    length += bytes.length;
  };

  put("%PDF-1.4\n");
  const startObject = (n) => { offsets[n] = length; put(`${n} 0 obj\n`); };

  startObject(1);
  put("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  startObject(2);
  put("<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  startObject(3);
  put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] `
    + "/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n");

  startObject(4);
  const filter = compressed ? "/Filter /FlateDecode " : "";
  const samples = compressed || rgb;
  put(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} `
    + `/ColorSpace /DeviceRGB /BitsPerComponent 8 ${filter}/Length ${samples.length} >>\nstream\n`);
  put(samples);
  put("\nendstream\nendobj\n");

  const content = `q ${pageWidth} 0 0 ${pageHeight} 0 0 cm /Im0 Do Q\n`;
  startObject(5);
  put(`<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);

  const xrefStart = length;
  let xref = "xref\n0 6\n0000000000 65535 f \n";
  for (let i = 1; i <= 5; i++) {
    xref += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  }
  put(xref);
  put(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF\n`);

  const out = new Uint8Array(length);
  let at = 0;
  for (const chunk of chunks) { out.set(chunk, at); at += chunk.length; }
  return out;
}

// Vector PDF: hand plotly's SVG to jsPDF + svg2pdf and write a real vector PDF — lines stay paths,
// text stays text, so it zooms cleanly and opens editable in Illustrator. Both libraries (MIT) are
// inlined into the report, so this needs no network. When they are missing (a hand-edited report, or
// a --plotly cdn copy that cannot reach the CDN) it returns null and the caller falls back to the
// old rasterise-then-wrap path, so the button never goes dead.
async function figurePdfVector(gd) {
  const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  // svg2pdf 的 UMD 导出是命名空间对象（window.svg2pdf.svg2pdf），不是函数本身
  const svg2pdfFn = window.svg2pdf && (typeof window.svg2pdf === "function"
    ? window.svg2pdf
    : (window.svg2pdf.svg2pdf || (window.svg2pdf.default && window.svg2pdf.default.svg2pdf)));
  if (!jsPDFCtor || typeof svg2pdfFn !== "function") return null;
  const width = Math.max(600, Math.round(gd._fullLayout.width));
  const height = Math.max(360, Math.round(gd._fullLayout.height));
  const dataUrl = await Plotly.toImage(gd, { format: "svg", width, height });
  const body = String(dataUrl).split(",")[1] || "";
  let svgText = /;base64/i.test(String(dataUrl)) ? atob(body) : decodeURIComponent(body);
  // 中文字形：内嵌 Noto Sans SC 子集（SIL OFL，随报告内联）。jsPDF 自带字体没有 CJK 字形，
  // 所以把 SVG 里的 font-family 一律改写到注册名 —— 必须整串替换，因为大量文本是从上层 <g>
  // 继承字体（只改 <text> 自身会漏掉它们，PDF 里中文仍是乱码）。
  const notoReady = typeof NOTO_FONT_B64 === "string" && NOTO_FONT_B64.length > 1000;
  if (notoReady) {
    svgText = svgText
      .replace(/font-family\s*=\s*"[^"]*"/gi, 'font-family="NotoSansSC"')
      .replace(/font-family\s*:\s*[^;"]*/gi, "font-family:NotoSansSC");
  }
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;width:" + width + "px;height:" + height + "px;";
  holder.innerHTML = svgText;
  document.body.appendChild(holder);
  try {
    const svg = holder.querySelector("svg");
    if (!svg) return null;
    const pt = (v) => (v * 72) / 96;   // plotly measures in CSS pixels (96dpi), PDF units are points (72dpi)
    const doc = new jsPDFCtor({
      unit: "pt",
      format: [pt(width), pt(height)],
      orientation: width >= height ? "landscape" : "portrait",
      compress: true,
    });
    // 中文字形：内嵌 Noto Sans SC 子集（SIL OFL，随报告内联），并把 SVG 的 font-family 指到它 ——
    // jsPDF 自带字体没有 CJK，不改写的话图例/轴标题里的中文会变乱码。缺这一块时退回标准字体。
    if (notoReady) {
      // jsPDF 2.x 必须先写进它的虚拟文件系统，再用"文件名"注册字体 —— 直接传 base64 当文件名
      // 会静默降级（内部报 "Font is not stored as string-data in vFS"），PDF 里中文仍变乱码。
      doc.addFileToVFS("NotoSansSC.ttf", NOTO_FONT_B64);
      doc.addFont("NotoSansSC.ttf", "NotoSansSC", "normal");
      doc.addFont("NotoSansSC.ttf", "NotoSansSC", "bold");
      doc.setFont("NotoSansSC", "normal");
    }
    await svg2pdfFn(svg, doc, { x: 0, y: 0, width: pt(width), height: pt(height) });
    return new Uint8Array(doc.output("arraybuffer"));
  } finally {
    document.body.removeChild(holder);
  }
}

// Rasterise one figure and return the PDF bytes.
async function figurePdfBytes(gd) {
  const width = Math.max(600, Math.round(gd._fullLayout.width));
  const height = Math.max(360, Math.round(gd._fullLayout.height));
  const scale = 2;
  const dataUrl = await Plotly.toImage(gd, { format: "png", width, height, scale });
  const img = await new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = dataUrl;
  });
  const canvas = document.createElement("canvas");
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";                       // PDF images carry no alpha
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  const rgba = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const rgb = new Uint8Array(canvas.width * canvas.height * 3);
  for (let i = 0, j = 0; i < rgba.length; i += 4, j += 3) {
    rgb[j] = rgba[i]; rgb[j + 1] = rgba[i + 1]; rgb[j + 2] = rgba[i + 2];
  }
  const compressed = await deflateBytes(rgb);
  return pdfFromImage(rgb, canvas.width, canvas.height, compressed);
}

function downloadBytes(bytes, filename, mime) {
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function toBase64(bytes) {
  let text = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    text += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(text);
}

// Hover text is preformatted so that missing values never print as "null".
function hoverFields(p, minFold, minUp) {
  const status = statusOf(p, minFold, minUp);
  const crapome = (p.cfreq === null || p.cfreq === undefined)
    ? "CRAPome not applied"
    : `CRAPome ${pct(p.cfreq)} (${p.chits ?? "–"}/${p.cruns ?? "–"} ${DATA.thresholds.crapomeCell} controls ≥${DATA.thresholds.crapomeMinSc} SC)`;
  const ann = annotationFor(p);
  const header = [];
  if (ann && ann.name) header.push(`<br><span style="color:#2f3f52">${ann.name}</span>`);
  else if (p.name) header.push(`<br><span style="color:#2f3f52">${p.name}</span>`);
  if (ann && ann.aliases) header.push(`<br><i style="color:#7a8794">also known as</i> ${ann.aliases}`);
  if (ann && ann.func) {
    header.push(`<br><span style="color:#4a5b6e">${wrapText(ann.func, 74)}</span>`);
  }
  return [
    p.gn, p.acc, header.join(""),
    (p.lb ? "≥ " : "") + fmt(p.fc, 2, "×"), fmt(p.fc_raw, 2, "×"),
    String(p.up), String(p.pep ?? "–"), String(p.psm ?? "–"),
    fmt(p.score, 3), fmt(p.bfdr, 3), fmt(p.q, 4),
    crapome,
    STATUS_LABEL[status] + (p.why ? " — " + p.why : ""),
    p.lb
      ? `<br><span style="color:#0b7285">EV not detected — EV-corrected FC is a lower bound (floor ${fmt(p.cuse, 0)})</span>`
      : "",
    (p.qc_combined === null || p.qc_combined === undefined) && !p.qc_bg_flag && !p.qc_cross
      ? ""
      : `<br><span style="color:#c92a2a">batch QC: combined score ${fmt(p.qc_combined, 3)}`
        + `${p.qc_bg_flag ? " · " + p.qc_bg_flag : ""}`
        + `${p.qc_cross ? " · " + p.qc_cross : ""}</span>`,
    fmt(p.log2fc, 2),
  ];
}

  };

  };

  // Manual marking. Names can be typed with autocomplete, or picked from the
  // candidate table; both feed the same pending list, and one "Add mark" turns it
  // into a colour group. Marked prey are drawn as filled dots in that colour and
  // labelled with their own name in the same colour.
  state.pending = [];

  function nameIndex() {
    if (state._nameIndex) return state._nameIndex;
    const map = new Map();
    for (const p of decodePoints(cond)) {
      if (p.gn) map.set(p.gn.toUpperCase(), p);
      if (p.acc) map.set(p.acc.toUpperCase(), p);
    }
    state._nameIndex = map;
    return map;
  }

  function addPending(token) {
    const key = String(token || "").trim().toUpperCase();
    if (!key || state.pending.includes(key)) return false;
    state.pending.push(key);
    return true;
  }

  const input = container.querySelector("#mark-input");
  const suggest = container.querySelector("#mark-suggest");

  function renderPending() {
    const host = container.querySelector("#mark-pending");
    host.innerHTML = state.pending.map((n) =>
      `<span class="pend-chip">${n}<button type="button" data-n="${n}" title="remove">×</button></span>`).join("");
    host.querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        state.pending = state.pending.filter((x) => x !== b.dataset.n);
        renderPending();
      };
    });
  }

  function showSuggestions(query) {
    const q = query.trim().toUpperCase();
    if (!q) { suggest.className = "suggest"; return; }
    const idx = nameIndex();
    const hits = [];
    const seen = new Set();
    for (const [key, p] of idx) {
      if (key.startsWith(q) || (p.gn && p.gn.toUpperCase().startsWith(q))) {
        const label = p.gn || p.acc;
        if (seen.has(label)) continue;
        seen.add(label);
        hits.push({ token: p.gn || p.acc, acc: p.acc, fc: p.fc, gn: p.gn });
      }
      if (hits.length >= 40) break;
    }
    hits.sort((a, b) => (b.fc || 0) - (a.fc || 0));
    const top = hits.slice(0, 8);
    if (!top.length) {
      suggest.className = "suggest show";
      suggest.innerHTML = `<div style="color:#8a94a6">no match in this condition</div>`;
      return;
    }
    suggest.className = "suggest show";
    suggest.innerHTML = top.map((h) =>
      `<div data-token="${h.token}"><b>${h.gn || h.acc}</b>` +
      `<span class="acc">${h.acc} · ${fmt(h.fc, 1, "×")}</span></div>`).join("");
    suggest.querySelectorAll("div[data-token]").forEach((el) => {
      el.onclick = () => {
        addPending(el.dataset.token);
        input.value = "";
        suggest.className = "suggest";
        renderPending();
      };
    });
  }

  input.addEventListener("input", () => showSuggestions(input.value));
  input.addEventListener("focus", () => showSuggestions(input.value));
  input.addEventListener("blur", () => setTimeout(() => { suggest.className = "suggest"; }, 180));
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      const typed = input.value.trim();
      if (typed) {
        // accept the first suggestion, otherwise the typed token itself
        const first = suggest.querySelector("div[data-token]");
        addPending(first ? first.dataset.token : typed);
        input.value = "";
        suggest.className = "suggest";

    input.focus();
